name: Sync Docker Images

on:
  schedule:
    # Every day at 00:00 UTC (08:00 China / 09:00 Japan)
    - cron: "0 0 * * *"

  push:
    branches:
      - main
    paths:
      - "images.yaml"
      - "auth.yaml"

  workflow_dispatch:

concurrency:
  group: image-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Images to TCR
    runs-on: ubuntu-latest

    env:
      TCR_USERNAME: ${{ secrets.ACR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate configuration
        run: |
          test -f images.yaml
          test -f auth.yaml

          echo "Configuration files:"
          ls -lh images.yaml auth.yaml

      - name: Sync Images
        uses: hhyasdf/image-sync-action@v1.1
        with:
          auth_file: ./auth.yaml
          images_file: ./images.yaml
          version: latest
          proc: 6