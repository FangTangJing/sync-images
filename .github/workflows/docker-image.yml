name: Sync Docker Images

on:
  schedule:
    # Every day at 00:00 UTC (08:00 China / 09:00 Japan)
    - cron: "0 0 * * *"

  push:
    branches:
      - main
    paths:
      - "images.yaml"
      - "auth.yaml"
      - ".github/workflows/docker-image.yml"

  workflow_dispatch:

concurrency:
  group: image-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Docker Images to ACR
    runs-on: ubuntu-latest

    env:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking configuration files..."

          test -f images.yaml || {
            echo "ERROR: images.yaml not found"
            exit 1
          }

          test -f auth.yaml || {
            echo "ERROR: auth.yaml not found"
            exit 1
          }

          echo "Configuration files:"
          ls -lh images.yaml auth.yaml

      - name: Sync Images
        uses: hhyasdf/image-sync-action@v1.1
        with:
          auth_file: ./auth.yaml
          images_file: ./images.yaml
          version: latest
          proc: 6
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}